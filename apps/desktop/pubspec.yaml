name: retcon_desktop
description: "The Retcon desktop shell: supervise and verify AI coding agents."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^8.0.3
  go_router: ^14.8.1
  logging: ^1.3.0
  provider: ^6.1.2
  retcon_design_system:
    path: ../../packages/retcon-design-system
  retcon_terminal_view:
    path: ../../packages/retcon-terminal-view
  retcon_file_viewer:
    path: ../../packages/retcon-file-viewer
  retcon_diff_viewer:
    path: ../../packages/retcon-diff-viewer
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
