name: CI

on:
  push:
    branches: [Master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  NODE_VERSION: "22.23.0"
  FLUTTER_VERSION: "3.38.3"
  BUN_VERSION: "1.3.10"
  RUST_VERSION: "1.93.0"

jobs:
  protocol:
    name: Protocol (schema + fixtures)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Run canonical protocol and metadata verification
        run: node scripts/verify.mjs --suite protocol

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run canonical Rust verification
        run: node scripts/verify.mjs --suite rust

  flutter:
    name: Flutter (all apps/packages analyze + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Analyze and test all six Flutter surfaces
        run: node scripts/verify.mjs --suite flutter

  browser-service:
    name: Browser service (lint, typecheck, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Run canonical browser-service verification
        run: node scripts/verify.mjs --suite browser

  website:
    name: Website (build and verify)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - name: Run canonical website verification
        run: node scripts/verify.mjs --suite website

  windows-build:
    name: Windows build
    runs-on: windows-2022
    needs: [rust, flutter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run canonical Windows release build
        run: node scripts/verify.mjs --suite windows-build
      - name: Upload core service artifact
        uses: actions/upload-artifact@v4
        with:
          name: retcon-core-windows
          path: |
            target/release/retcon-core.exe
            target/release/retcon.exe
      - name: Upload desktop shell artifact
        uses: actions/upload-artifact@v4
        with:
          name: retcon-desktop-windows
          path: apps/desktop/build/windows/x64/runner/Release/
